<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Blueprint Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6" />
    </pattern>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.15" />
    </filter>

    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="leafHeaderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="#090d16" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Top System Header Badge -->
  <g transform="translate(40, 30)">
    <rect width="210" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#10b981" />
    <text x="26" y="18" fill="#10b981" font-family="monospace, monospace" font-size="11" font-weight="600">LINUX 6.1+ MAPLE TREE</text>
  </g>

  <g transform="translate(560, 30)">
    <rect width="200" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="100" y="18" fill="#94a3b8" font-family="monospace, monospace" font-size="11" text-anchor="middle">B* RANGE HIERARCHY</text>
  </g>

  <!-- Connecting Links -->
  <path d="M 400 135 C 400 180, 220 180, 220 220" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 2" />
  <path d="M 400 135 C 400 180, 580 180, 580 220" fill="none" stroke="#10b981" stroke-width="2" />

  <!-- ROOT NODE (Interior) -->
  <g transform="translate(260, 75)" filter="url(#glow)">
    <rect width="280" height="60" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
    <rect width="280" height="22" rx="8" fill="url(#headerGrad)" />
    <rect y="16" width="280" height="6" fill="url(#headerGrad)" />
    <line x1="0" y1="22" x2="280" y2="22" stroke="#334155" stroke-width="1" />
    <text x="10" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Node 0 • Interior Root (Order 4)</text>

    <!-- Slots / Pivots -->
    <line x1="140" y1="22" x2="140" y2="60" stroke="#1e293b" stroke-width="1" />
    <text x="70" y="44" fill="#38bdf8" font-family="monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">≤ 0x400000</text>
    <text x="210" y="44" fill="#94a3b8" font-family="monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">≤ 0x7fffffffffff</text>
  </g>

  <!-- LEFT CHILD (Leaf Node 1) -->
  <g transform="translate(80, 220)">
    <rect width="280" height="120" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
    <rect width="280" height="24" rx="8" fill="url(#leafHeaderGrad)" />
    <rect y="18" width="280" height="6" fill="url(#leafHeaderGrad)" />
    <line x1="0" y1="24" x2="280" y2="24" stroke="#047857" stroke-width="1" />
    <text x="10" y="16" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Node 1 • Leaf (Low VMAs)</text>

    <!-- Entries -->
    <!-- Entry 1: text -->
    <rect x="8" y="34" width="76" height="74" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="14" y="40" width="64" height="18" rx="3" fill="#10b981" opacity="0.2" />
    <text x="46" y="53" fill="#34d399" font-family="monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[text: r-x]</text>
    <text x="46" y="74" fill="#64748b" font-family="monospace, monospace" font-size="8" text-anchor="middle">0x400000</text>
    <text x="46" y="88" fill="#94a3b8" font-family="monospace, monospace" font-size="8" text-anchor="middle">– 0x401000</text>

    <!-- Entry 2: data -->
    <rect x="92" y="34" width="80" height="74" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="98" y="40" width="68" height="18" rx="3" fill="#38bdf8" opacity="0.2" />
    <text x="132" y="53" fill="#38bdf8" font-family="monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[data: rw-]</text>
    <text x="132" y="74" fill="#64748b" font-family="monospace, monospace" font-size="8" text-anchor="middle">0x401000</text>
    <text x="132" y="88" fill="#94a3b8" font-family="monospace, monospace" font-size="8" text-anchor="middle">– 0x402000</text>

    <!-- Entry 3: heap -->
    <rect x="180" y="34" width="90" height="74" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="186" y="40" width="78" height="18" rx="3" fill="#f59e0b" opacity="0.2" />
    <text x="225" y="53" fill="#fbbf24" font-family="monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[heap: brk]</text>
    <text x="225" y="74" fill="#64748b" font-family="monospace, monospace" font-size="8" text-anchor="middle">0x600000</text>
    <text x="225" y="88" fill="#94a3b8" font-family="monospace, monospace" font-size="8" text-anchor="middle">– 0x620000</text>
  </g>

  <!-- RIGHT CHILD (Leaf Node 2 - Highlighted) -->
  <g transform="translate(440, 220)" filter="url(#glow)">
    <rect width="280" height="120" rx="8" fill="#0b1120" stroke="#10b981" stroke-width="1.5" />
    <rect width="280" height="24" rx="8" fill="url(#leafHeaderGrad)" />
    <rect y="18" width="280" height="6" fill="url(#leafHeaderGrad)" />
    <line x1="0" y1="24" x2="280" y2="24" stroke="#047857" stroke-width="1" />
    <text x="10" y="16" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Node 2 • Leaf (High VMAs &amp; Stack)</text>

    <!-- Entries -->
    <!-- Entry 1: libc -->
    <rect x="8" y="34" width="84" height="74" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="14" y="40" width="72" height="18" rx="3" fill="#818cf8" opacity="0.2" />
    <text x="50" y="53" fill="#a5b4fc" font-family="monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[libc.so: r-x]</text>
    <text x="50" y="74" fill="#64748b" font-family="monospace, monospace" font-size="8" text-anchor="middle">0x7f800000</text>
    <text x="50" y="88" fill="#94a3b8" font-family="monospace, monospace" font-size="8" text-anchor="middle">– 0x7f9a0000</text>

    <!-- Entry 2: stack (Targeted Hit) -->
    <rect x="100" y="34" width="86" height="74" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <rect x="106" y="40" width="74" height="18" rx="3" fill="#10b981" />
    <text x="143" y="53" fill="#ffffff" font-family="monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[stack: rw-]</text>
    <text x="143" y="74" fill="#a7f3d0" font-family="monospace, monospace" font-size="8" text-anchor="middle">0x7fff0000</text>
    <text x="143" y="88" fill="#34d399" font-family="monospace, monospace" font-size="8" font-weight="600" text-anchor="middle">– 0x7fff8000</text>

    <!-- Entry 3: vsyscall -->
    <rect x="194" y="34" width="78" height="74" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="200" y="40" width="66" height="18" rx="3" fill="#64748b" opacity="0.2" />
    <text x="233" y="53" fill="#94a3b8" font-family="monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">[vsyscall]</text>
    <text x="233" y="74" fill="#64748b" font-family="monospace, monospace" font-size="8" text-anchor="middle">0x7ffffffff000</text>
    <text x="233" y="88" fill="#94a3b8" font-family="monospace, monospace" font-size="8" text-anchor="middle">– 0x7fffffffffff</text>
  </g>

  <!-- Bottom Syscall Telemetry Pill -->
  <g transform="translate(180, 385)">
    <rect width="440" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <circle cx="20" cy="17" r="4" fill="#10b981" />
    <text x="34" y="21" fill="#38bdf8" font-family="monospace, monospace" font-size="11" font-weight="600">sys_mmap</text>
    <text x="96" y="21" fill="#e2e8f0" font-family="monospace, monospace" font-size="11">(0x7fff0000, 0x8000, PROT_READ|PROT_WRITE, MAP_GROWSDOWN)</text>
  </g>
</svg>
